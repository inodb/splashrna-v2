name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # vite copies public/ into dist/, which includes the off-target and gene
      # indexes. They are committed, so the deploy needs no secrets and no access
      # to the private data repository.
      - run: npm run build

      - name: Confirm the indexes made it into the build
        run: |
          test -f dist/splashrna-model.json
          test -f dist/offtarget/manifest.json
          test -f dist/genes/genes.bin
          du -sh dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
