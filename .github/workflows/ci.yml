name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Rebuild the model bundle from the committed parameters
        run: |
          pip install numpy
          python3 tools/build_model.py /tmp/fresh-model.json

      - name: The committed bundle must match a fresh build
        # Deliberately not a byte comparison. The bundle's floats come out of NumPy,
        # and different NumPy/BLAS builds differ in the last bit or two of a dot
        # product -- measured at 1.9e-13 between 1.26.4 and 2.5.5, which is six orders
        # of magnitude below our agreement with the original Shogun models. What has
        # to hold is that the two are the same model numerically.
        run: python3 tools/compare_model.py public/splashrna-model.json /tmp/fresh-model.json

      - name: Check that the Python reference agrees with the fixtures
        run: python3 tools/validate.py

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive the built site in a real browser
        # The optional indexes are derived data and are not committed, so the
        # index-dependent checks report SKIP here rather than failing.
        run: npm run browser-check

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
